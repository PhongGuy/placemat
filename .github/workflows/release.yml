# Builds release artifacts on a v* tag and drafts a GitHub release that a human publishes.
# Build jobs hold no secrets and restore no cache; a tag run signs the update manifest, checks
# it against the committed keys and attests every file before drafting.
# A manual run builds a chosen set of platforms; with dry_run it drafts nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without drafting a release
        type: boolean
        default: true
      platforms:
        description: Comma-separated subset of linux,windows,macos-arm64,macos-intel (macOS bills 10x)
        type: string
        default: linux,windows,macos-arm64

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # GPUI's system libraries for the app.
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1

jobs:
  # Refuses a wrong tag, a keys file a shipped build could not verify an update with, and a
  # commit that credits an AI agent, before anything compiles.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.guard.outputs.version }}
      linux: ${{ steps.guard.outputs.linux }}
      desktop: ${{ steps.guard.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The trailer check reads every commit since the previous tag.
          fetch-depth: 0
      - name: No AI trailers since the previous tag
        run: scripts/check-trailers.sh HEAD
      - id: guard
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          PLATFORMS: ${{ inputs.platforms }}
        run: scripts/release.sh guard "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$DRY_RUN" "$PLATFORMS" >>"$GITHUB_OUTPUT"

  build-linux:
    needs: guard
    if: needs.guard.outputs.linux != ''
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    # Built against 22.04's glibc, so the binary needs at most GLIBC_2.35 and runs on 22.04 LTS and newer.
    container:
      image: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    timeout-minutes: 90
    env:
      # core's build script refuses to compile a release build that trusts no real update key.
      PLACEMAT_RELEASE_BUILD: "1"
      # linuxdeploy runs its own AppImages, and the container has no FUSE for them.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      # First, since checkout needs git to clone rather than fetch a tarball. The container runs as root.
      - name: Install build tools and system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git file $LINUX_BUILD_DEPS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Package
        run: make package
      # The notices ship inside every package; the checksums job writes the one SHA256SUMS.
      - name: Drop per-runner loose files
        run: rm -f target/dist/linux/SHA256SUMS target/dist/linux/THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/linux/
          if-no-files-found: error

  build-desktop:
    needs: guard
    if: needs.guard.outputs.desktop != ''
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # core's build script refuses to compile a release build that trusts no real update key.
      PLACEMAT_RELEASE_BUILD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Build
        run: bash scripts/release.sh build
      - name: Package
        run: bash scripts/release.sh package
      - name: Drop per-runner loose files
        run: rm -f target/dist/*/SHA256SUMS target/dist/*/THIRD-PARTY-NOTICES.html
      # Rooted at the platform directory, so the merged download in checksums is flat.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/${{ runner.os == 'macOS' && 'macos' || 'windows' }}/
          if-no-files-found: error
      # Only macOS has an update-only file: the signed .app.tar.gz the updater swaps in.
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-${{ matrix.target }}
          path: target/update/macos/
          if-no-files-found: error

  # Adds the stable-named copies and SHA256SUMS, writes the unsigned update manifest on a tag release,
  # and hands dist/ and update/ on as one artifact.
  checksums:
    needs: [guard, build-linux, build-desktop]
    # One build side is skipped on a dry run that selects none of its platforms.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build-desktop.result == 'success'
        with:
          pattern: update-*
          path: update
          merge-multiple: true
      - name: Make sure update/ exists
        run: mkdir -p update
      # Unversioned copies, so the README links /releases/latest/download/<name> directly.
      - name: Add stable-named copies
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/release.sh stable dist "$VERSION"
      - name: Write SHA256SUMS
        run: scripts/release.sh sums dist
      # Only a release that drafts gets a manifest, so a dry run never signs anything.
      - name: Write the update manifest
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/release.sh manifest dist update "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      # Two paths root the artifact at the workspace, so it unpacks as dist/ and update/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: |
            dist/
            update/
          if-no-files-found: error

  # Signs latest.json, checks the signature against the committed keys, then attests every release
  # file, so a download verifies with gh attestation verify. It compiles nothing and runs only the
  # distro minisign, base64 and shell builtins; the signing key lives on the sign step alone. The
  # release environment makes a tag run wait here for the owner's approval.
  attest:
    needs: [guard, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation on the repository
      artifact-metadata: write # link the attestation to the release files
    steps:
      # The committed keys file, read only by the verify step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: assets/update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
      # From Ubuntu's signed archive at a pinned version, before any step holds a secret.
      - name: Install minisign
        if: hashFiles('update/latest.json') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign=0.11-1
      # The key secret is a base64 minisign key box. Builtins pipe both secrets, so neither
      # touches disk or a process's arguments.
      - name: Sign the update manifest
        if: hashFiles('update/latest.json') != ''
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" |
            minisign -S -s <(printf '%s' "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" | base64 -d) \
              -m update/latest.json -x update/latest.json.minisig
      # A manifest signed by a key the shipped builds do not trust would strand every client,
      # so the signature must verify with one of the committed keys before anything is attested.
      - name: Verify it against the committed keys
        if: hashFiles('update/latest.json') != ''
        shell: bash
        run: |
          signed=
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | tr -d '[:space:]')
            [[ -z $line || $line == \#* ]] && continue
            key=$(printf '%s' "$line" | base64 -d | sed -n 2p)
            if minisign -Vq -P "$key" -m update/latest.json -x update/latest.json.minisig; then signed=1; fi
          done < assets/update/keys.txt
          if [ -z "$signed" ]; then
            echo "the manifest signature does not verify with any key in assets/update/keys.txt" >&2
            exit 1
          fi
          # The updater reads the signature box base64-wrapped onto one line.
          base64 -w0 update/latest.json.minisig > update/latest.json.sig
          rm update/latest.json.minisig
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            update/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ needs.guard.outputs.version }}
          path: |
            dist/
            update/
          if-no-files-found: error

  # Drafts the release from the signed set the attest job attested.
  draft:
    needs: [guard, checksums, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' && github.ref_type == 'tag' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      # Full history and tags, so the notes can find the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ needs.guard.outputs.version }}
      # The script splices GitHub's label-grouped notes into the shared layout, so gh is not asked to generate them again.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Placemat $VERSION" --notes-file "$RUNNER_TEMP/notes.md" dist/* update/*
