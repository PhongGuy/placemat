[package]
name = "placemat-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace root, so cargo never walks up into an enclosing checkout and the host's
# test-support features never reach the app's workspace.
[workspace]

[lints.rust]
unsafe_code = "deny"

[dependencies]
placemat-app = { path = "../../crates/placemat-app" }
gpui-kit = "=0.11.0"
gpui-pilot-host = { git = "https://github.com/PhongGuy/gpui-pilot", tag = "v0.9.4" }
anyhow = "1"

[dev-dependencies]
placemat-core = { path = "../../crates/placemat-core" }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
serde_json = "1"
toml = "1"
tempfile = "3"

# Headless frame numbers need an optimised host and app.
[profile.dev.package."*"]
opt-level = 3

# Test binaries carry no debug info: it is most of a target dir's size.
[profile.test]
debug = false
